<!DOCTYPE html>

  <meta charset="UTF-8">
  <title>ランダム駅決定</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: sans-serif;
      background-color: #f5f5f5;
    }

    #controls {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      z-index: 10;
    }

    button {
      font-size: 1.5em;
      padding: 10px 30px;
      cursor: pointer;
    }

    #grid {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      width: 90vmin;
      height: 90vmin;
    }

    .cell {
      border: 2px solid #ccc;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2vmin;
      background-color: white;
      text-align: center;
      flex-direction: column;
      box-sizing: border-box;
      padding: 5px;
    }

    .highlight {
      background-color: yellow;
    }
  </style>
</head>

        }
    }

    function updateGridRandomly() {
        const cells = document.querySelectorAll("#grid .cell");
        cells.forEach(cell => {
        const s = getRandomStation();
        cell.innerHTML = `<div>${s.station_name}</div><div style="font-size:1.5vmin;">${s.line_name}</div>`;
        cell.classList.remove("highlight");
        });
    }

    function stopAnimationAndFixResult() {
        clearInterval(intervalId);
        const cells = document.querySelectorAll("#grid .cell");
        cells.forEach(cell => cell.innerHTML = '');

        const result = getRandomStation();
        const targetCell = cells[Math.floor(Math.random() * cells.length)];
        targetCell.innerHTML = `<div>${result.station_name}</div><div style="font-size:1.5vmin;">${result.line_name}</div>`;
        targetCell.classList.add("highlight");
    }

    function startAnimation() {
        createGrid();
        intervalId = setInterval(updateGridRandomly, 100);
        setTimeout(stopAnimationAndFixResult, 3000);
    }

    // 初期表示
    createGrid();
  </script>
</body>
</html>

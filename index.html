// Leafletマップ初期化
const map = L.map('map').setView([35.68, 139.76], 12);
const colorMap = {
  "赤": "#FF0000",
  "青": "#0000FF",
  "黄": "#FFFF00",
  "緑": "#008000",
  "紫": "#800080",
  "オレンジ": "#FFA500",
  "茶色": "#A52A2A",
  "灰色": "#808080"
};

// 線を路線ごとに描画
const lines = {};
stations.forEach(station => {
  if (!lines[station.line_cd]) {
    lines[station.line_cd] = {
      color: `#${station.line_color_c}`,
      name: station.line_name,
      latlngs: []
    };
  }
  lines[station.line_cd].latlngs.push([station.lat, station.lon]);
});

// 路線ごとのPolyline描画＋ラベル
Object.values(lines).forEach(line => {
  const polyline = L.polyline(line.latlngs, {
    color: line.color,
    weight: 5
  }).addTo(map);

  polyline.bindPopup(`${line.name}`);

  // 線の中間地点にラベル
  const midIndex = Math.floor(line.latlngs.length / 2);
  const midLatLng = line.latlngs[midIndex];
  L.marker(midLatLng, {
    icon: L.divIcon({
      className: 'line-label',
      html: `<span style="color:${line.color};">${line.name}</span>`,
      iconSize: [130, 20],
    })
  }).addTo(map);
});

// 駅を描画
stations.forEach(station => {
  const marker = L.circleMarker([station.lat, station.lon], {
    radius: 6,
    fillColor: colorMap[station.color],
    color: '#000',
    weight: 1,
    opacity: 1,
    fillOpacity: 0.9
  }).addTo(map);

  // 駅名のラベルを表示
  L.marker([station.lat, station.lon], {
    icon: L.divIcon({
      className: 'station-label',
      html: `<span style="color:#${station.line_color_c};">${station.station_name}</span>`,
      iconSize: [100, 20]
    })
  }).addTo(map);
});
